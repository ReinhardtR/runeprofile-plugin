plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.runeprofile'
version = '2.8.0'
sourceCompatibility = "1.8"

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

/**
 * Launches a development client with this plugin side-loaded.
 *
 * Assertions are on because RuneLite requires -ea to load a plugin this way, and
 * DevMode reads that to decide it is a dev client.
 *
 *   ./gradlew runClient              production API
 *   ./gradlew runClient -PlocalApi   a backend on localhost:8787
 */
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs a dev client with the plugin loaded.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.runeprofile.RuneProfilePluginTest'
    enableAssertions = true

    if (project.hasProperty('localApi')) {
        systemProperty 'runeprofile.localApi', 'true'
    }
}
